# HTTP interno. El SSL lo termina nginx del VPS (o ninguno en local).
server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    root /var/www/gijac-message-business/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # WebSocket (beyondcode/laravel-websockets) -> contenedor websocket
    location ~ ^/(app|apps|ws|wss)/ {
        proxy_pass http://websocket:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_redirect off;
    }
}
